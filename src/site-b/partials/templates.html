<template id="tpl-card">
  <article class="card">
    <button class="card__art" type="button" data-quick data-cursor="View" aria-label="Quick view">
      <img data-slot="img" src="assets/img/packs/spicy-60-sm.webp" alt="" width="390" height="560" loading="lazy">
    </button>
    <span class="card__badge tag tag--abin" data-slot="badge" hidden></span>
    <div class="card__body">
      <p class="card__bm" data-slot="bm"></p>
      <div class="card__row">
        <h3 class="card__name"><a data-slot="link" href="product.html"><span data-slot="name"></span></a></h3>
        <strong class="card__price" data-slot="price"></strong>
      </div>
      <p class="card__tagline" data-slot="tagline"></p>
      <p class="card__meta"><span data-slot="kcal"></span><span data-slot="diet"></span></p>
      <div class="card__buy">
        <div class="sizes" data-size role="group" aria-label="Pack size"><button type="button" data-g="30">30 g</button><button type="button" data-g="60">60 g</button></div>
        <button class="btn btn--sm card__add" type="button" data-add><i data-icon="plus"></i>Add to bag</button>
      </div>
    </div>
  </article>
</template>

<template id="tpl-trade">
  <article class="tcard">
    <div class="tcard__art"><img data-slot="img" src="assets/img/packs/spicy-30-sm.webp" alt="" width="390" height="560" loading="lazy"></div>
    <div class="tcard__body">
      <h3 class="tcard__name"><span data-slot="name"></span> <span class="tcard__size" data-slot="label"></span></h3>
      <svg class="tcard__ean" data-slot="ean" aria-hidden="true"></svg>
      <dl class="tcard__specs">
        <div><dt>Barcode</dt><dd data-slot="barcode"></dd></div>
        <div><dt>Shelf life</dt><dd data-slot="shelf"></dd></div>
        <div><dt>Per carton</dt><dd data-slot="carton"></dd></div>
      </dl>
      <p class="tcard__src" data-slot="confirm"></p>
      <div class="tcard__buy">
        <div class="qty qty--sm"><button type="button" data-t-step="-1" aria-label="One carton less"><i data-icon="minus"></i></button><input data-t-qty type="number" min="1" max="999" value="1" aria-label="Cartons"><button type="button" data-t-step="1" aria-label="One carton more"><i data-icon="plus"></i></button></div>
        <button class="btn btn--sm" type="button" data-t-add><i data-icon="plus"></i>Add to enquiry</button>
      </div>
    </div>
  </article>
</template>

<template id="tpl-bag-line">
  <li class="bag-line">
    <img class="bag-line__img" data-slot="img" src="assets/img/packs/spicy-30-sm.webp" alt="" width="390" height="560">
    <div class="bag-line__info"><strong data-slot="name"></strong><span><span data-slot="label"></span><span data-slot="unit"></span></span></div>
    <div class="bag-line__qty"><button type="button" data-bag-step="-1" aria-label="One less"><i data-icon="minus"></i></button><span data-slot="qty">1</span><button type="button" data-bag-step="1" aria-label="One more"><i data-icon="plus"></i></button></div>
    <strong class="bag-line__total" data-slot="total"></strong>
    <button class="bag-line__x" type="button" data-bag-remove aria-label="Remove from bag"><i data-icon="close"></i></button>
  </li>
</template>

<template id="tpl-faq">
  <details class="faq-item" data-animate>
    <summary><span class="faq-item__q" data-slot="q"></span><span class="faq-item__icon" aria-hidden="true"><i data-icon="plus"></i></span></summary>
    <div class="faq-item__a"><p data-slot="a"></p><p class="faq-item__cat" data-slot="cat"></p></div>
  </details>
</template>
